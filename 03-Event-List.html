<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        /* Full viewport height layout */
        html {
            height: 100%;
            overflow-x: auto;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            min-width: 1200px; /* Forces full canvas width for browser horizontal scrollbar */
            display: flex;
            flex-direction: column;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        .container {
            padding: 10px;
            width: 100%;
            flex: 1 0 auto; /* Pushes footer down to the very bottom */
        }

        .table-responsive {
            width: 100%;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: maroon;
            color: white;
        }

        th, td {
            padding: 8px;
            border: 1px solid #ddd;
            white-space: nowrap;
            text-align: left;
        }

        th {
            background-color: #6c0202;
        }

        th:last-child, td:last-child {
            text-align: center;
            width: 120px;
        }

        .filter-container {
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-container input,
        .filter-container select {
            padding: 6px;
            min-width: 150px;
        }

        button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            background-color: #6c0202;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: darkred;
        }

        .btn-edit {
            background-color: #f39c12;
            color: white;
            font-weight: bold;
        }

        .btn-save {
            background-color: #27ae60;
            color: white;
            font-weight: bold;
        }

        .btn-cancel {
            background-color: #7f8c8d;
            color: white;
        }

        /* Sticky Footer pinned to bottom of the viewport page */
        footer {
            text-align: center;
            padding: 15px;
            background-color: #333;
            color: white;
            margin-top: auto;
            position: sticky;
            bottom: 0;
            width: 100%;
            z-index: 100;
        }

        footer button {
            background-color: maroon;
        }

        .inline-edit-input, .inline-edit-select {
            width: 100%;
            box-sizing: border-box;
            padding: 4px;
            font-size: 13px;
        }

        /* Mobile View (Card Layout) */
        @media screen and (max-width: 768px) {
            html {
                overflow-x: hidden;
            }

            body {
                padding: 5px;
                min-width: 100%;
            }

            .container {
                padding: 5px;
            }

            h1 {
                font-size: 22px;
            }

            .filter-container {
                flex-direction: column;
                gap: 8px;
            }

            .filter-container div {
                width: 100%;
            }

            .filter-container input,
            .filter-container select {
                width: 100%;
            }

            table {
                min-width: 100%;
                border: none;
                background-color: transparent;
            }

            #eventTable,
            #eventTable thead,
            #eventTable tbody,
            #eventTable th,
            #eventTable td,
            #eventTable tr {
                display: block;
            }

            #eventTable thead {
                display: none;
            }

            #eventTable tr {
                margin-bottom: 15px;
                border: 2px solid maroon;
                border-radius: 8px;
                background: white;
                color: black;
                padding: 8px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            }

            #eventTable td {
                border: none;
                border-bottom: 1px solid #ddd;
                position: relative;
                padding: 8px 8px 8px 38%;
                text-align: left;
                min-height: 38px;
                word-break: break-word;
                white-space: normal;
                width: 100% !important;
                box-sizing: border-box;
            }

            #eventTable td:last-child {
                border-bottom: none;
                padding-left: 8px;
            }

            #eventTable td:before {
                position: absolute;
                left: 8px;
                top: 8px;
                width: 30%;
                font-weight: bold;
                white-space: nowrap;
                color: maroon;
                font-size: 12px;
            }

            #eventTable td:last-child:before {
                content: "" !important;
            }

            /* Mobile Column Labels */
            #eventTable td:nth-child(1):before { content: "S.No"; }
            #eventTable td:nth-child(2):before { content: "Occasion"; }
            #eventTable td:nth-child(3):before { content: "From Name"; }
            #eventTable td:nth-child(4):before { content: "From Email"; }
            #eventTable td:nth-child(5):before { content: "From Mobile"; }
            #eventTable td:nth-child(6):before { content: "To Name"; }
            #eventTable td:nth-child(7):before { content: "Greet Name"; }
            #eventTable td:nth-child(8):before { content: "To Email"; }
            #eventTable td:nth-child(9):before { content: "To Mobile"; }
            #eventTable td:nth-child(10):before { content: "Relation"; }
            #eventTable td:nth-child(11):before { content: "Recurring"; }
            #eventTable td:nth-child(12):before { content: "Reminder"; }
            #eventTable td:nth-child(13):before { content: "Date"; }

            #eventTable td button {
                width: 100%;
                margin: 4px 0;
                padding: 8px;
            }

            .inline-edit-input, .inline-edit-select {
                font-size: 14px;
                padding: 6px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Event Management</h1>

    <!-- Filters -->
    <div class="filter-container">
        <div>
            <label>Name:</label><br>
            <input type="text" id="nameFilter" placeholder="Search name...">
        </div>

        <div>
            <label>Occasion:</label><br>
            <select id="occasionFilter">
                <option value="">All</option>
            </select>
        </div>

        <div>
            <label>Month:</label><br>
            <select id="monthFilter">
                <option value="">All</option>
                <option value="01">Jan</option>
                <option value="02">Feb</option>
                <option value="03">Mar</option>
                <option value="04">Apr</option>
                <option value="05">May</option>
                <option value="06">Jun</option>
                <option value="07">Jul</option>
                <option value="08">Aug</option>
                <option value="09">Sep</option>
                <option value="10">Oct</option>
                <option value="11">Nov</option>
                <option value="12">Dec</option>
            </select>
        </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
        <table id="eventTable">
            <thead>
            <tr>
                <th>S.No</th>
                <th>Occasion</th>
                <th>From Name</th>
                <th>From Email</th>
                <th>From Mobile</th>
                <th>To Name</th>
                <th>Greet Name</th>
                <th>To Email</th>
                <th>To Mobile</th>
                <th>Relation</th>
                <th>Recurring</th>
                <th>Reminder</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="eventList"></tbody>
        </table>
    </div>
</div>

<footer>
    <a href="index.html"><button>Back to Main Menu</button></a>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDAHhKZEFIm4Z1HyTRGCaqJ1NGC7KelQ38",
  authDomain: "tavinderevents.firebaseapp.com",
  projectId: "tavinderevents",
  storageBucket: "tavinderevents.firebasestorage.app",
  messagingSenderId: "62017081718",
  appId: "1:62017081718:web:503ed1151d3235f719aa57",
  measurementId: "G-7RYTW534N1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let selectedOccasion = "";
let selectedMonth = "";
let searchName = "";
let allEventsCache = [];

const occasionOptions = ["ReminderSelf", "Reminder-Birthday", "Reminder-Anniversary", "Birthday", "Anniversary", "Reminder"];
const relationOptions = ["Self", "Friend", "Colleague", "Father", "Mother", "Brother", "Sister", "Son", "Daughter"];
const recurringOptions = ["Yearly", "Monthly", "Weekly"];

async function getEvent() {
    const eventList = document.getElementById("eventList");
    eventList.innerHTML = "";

    try {
        const snapshot = await getDocs(collection(db, "Event"));

        if (snapshot.empty) {
            eventList.innerHTML = "<tr><td colspan='14'>No data available.</td></tr>";
            return;
        }

        allEventsCache = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
        }));

        renderTable();
    } catch (error) {
        console.error("ERROR loading data:", error);
        eventList.innerHTML = "<tr><td colspan='14'>Error loading data.</td></tr>";
    }
}

function renderTable() {
    const eventList = document.getElementById("eventList");
    eventList.innerHTML = "";

    const filteredEvents = allEventsCache.filter(event => {
        let month = "";
        if (event.Date) {
            const d = new Date(event.Date);
            if (!isNaN(d)) {
                month = String(d.getMonth() + 1).padStart(2, "0");
            }
        }

        const fromName = (event.From_Name || "").toLowerCase();
        const toName = (event.To_Name || "").toLowerCase();
        const email = (event.To_Email || "").toLowerCase();
        const occasion = (event.Occasion || "").toLowerCase();

        const matchName = searchName
            ? fromName.includes(searchName.toLowerCase()) ||
              toName.includes(searchName.toLowerCase()) ||
              email.includes(searchName.toLowerCase()) ||
              occasion.includes(searchName.toLowerCase())
            : true;

        const matchOccasion = selectedOccasion ? event.Occasion === selectedOccasion : true;
        const matchMonth = selectedMonth ? month === selectedMonth : true;

        return matchName && matchOccasion && matchMonth;
    });

    filteredEvents.sort((a, b) => (Number(a.SNo) || 0) - (Number(b.SNo) || 0));

    if (filteredEvents.length === 0) {
        eventList.innerHTML = "<tr><td colspan='14'>No matching events found.</td></tr>";
        return;
    }

    filteredEvents.forEach(event => {
        const row = document.createElement("tr");
        row.setAttribute("id", `row-${event.id}`);

        row.innerHTML = `
            <td>${event.SNo ?? ""}</td>
            <td>${event.Occasion ?? ""}</td>
            <td>${event.From_Name ?? ""}</td>
            <td>${event.From_Email ?? ""}</td>
            <td>${event.From_Mobile ?? ""}</td>
            <td>${event.To_Name ?? ""}</td>
            <td>${event.To_Gname ?? ""}</td>
            <td>${event.To_Email ?? ""}</td>
            <td>${event.To_Mobile ?? ""}</td>
            <td>${event.Relation ?? ""}</td>
            <td>${event.Recurring ?? ""}</td>
            <td>${event.Reminder_Message ?? ""}</td>
            <td>${event.Date ?? ""}</td>
            <td>
                <button class="btn-edit" onclick="enableRowEditing('${event.id}')">Edit</button>
            </td>
        `;

        eventList.appendChild(row);
    });
}

window.enableRowEditing = function(docId) {
    const event = allEventsCache.find(e => e.id === docId);
    if (!event) return;

    const row = document.getElementById(`row-${docId}`);

    const createSelect = (options, currentValue) => {
        let html = `<select class="inline-edit-select">`;
        options.forEach(opt => {
            const selected = opt === currentValue ? 'selected' : '';
            html += `<option value="${opt}" ${selected}>${opt}</option>`;
        });
        html += `</select>`;
        return html;
    };

    row.innerHTML = `
        <td><input type="number" class="inline-edit-input" value="${event.SNo ?? ''}"></td>
        <td>${createSelect(occasionOptions, event.Occasion)}</td>
        <td><input type="text" class="inline-edit-input" value="${event.From_Name ?? ''}"></td>
        <td><input type="email" class="inline-edit-input" value="${event.From_Email ?? ''}"></td>
        <td><input type="text" class="inline-edit-input" value="${event.From_Mobile ?? ''}"></td>
        <td><input type="text" class="inline-edit-input" value="${event.To_Name ?? ''}"></td>
        <td><input type="text" class="inline-edit-input" value="${event.To_Gname ?? ''}"></td>
        <td><input type="email" class="inline-edit-input" value="${event.To_Email ?? ''}"></td>
        <td><input type="text" class="inline-edit-input" value="${event.To_Mobile ?? ''}"></td>
        <td>${createSelect(relationOptions, event.Relation)}</td>
        <td>${createSelect(recurringOptions, event.Recurring)}</td>
        <td><input type="text" class="inline-edit-input" value="${event.Reminder_Message ?? ''}"></td>
        <td><input type="date" class="inline-edit-input" value="${event.Date ?? ''}"></td>
        <td>
            <button class="btn-save" onclick="saveRow('${docId}')">Save</button>
            <button class="btn-cancel" onclick="renderTable()">Cancel</button>
        </td>
    `;
};

window.saveRow = async function(docId) {
    const row = document.getElementById(`row-${docId}`);
    const inputs = row.querySelectorAll("input, select");

    const updatedData = {
        SNo: Number(inputs[0].value),
        Occasion: inputs[1].value,
        From_Name: inputs[2].value,
        From_Email: inputs[3].value,
        From_Mobile: inputs[4].value,
        To_Name: inputs[5].value,
        To_Gname: inputs[6].value,
        To_Email: inputs[7].value,
        To_Mobile: inputs[8].value,
        Relation: inputs[9].value,
        Recurring: inputs[10].value,
        Reminder_Message: inputs[11].value,
        Date: inputs[12].value
    };

    try {
        await updateDoc(doc(db, "Event", docId), updatedData);
        alert("Record updated successfully!");
        await getEvent();
    } catch (error) {
        console.error("Error updating document: ", error);
        alert("Failed to update record.");
    }
};

async function populateOccasionFilter() {
    const select = document.getElementById("occasionFilter");
    try {
        const snapshot = await getDocs(collection(db, "Event"));
        const set = new Set();

        snapshot.docs.forEach(doc => {
            const occ = doc.data().Occasion;
            if (occ) set.add(occ);
        });

        set.forEach(o => {
            const opt = document.createElement("option");
            opt.value = o;
            opt.textContent = o;
            select.appendChild(opt);
        });
    } catch (error) {
        console.error("Dropdown error:", error);
    }
}

document.getElementById("occasionFilter").addEventListener("change", e => {
    selectedOccasion = e.target.value;
    renderTable();
});

document.getElementById("monthFilter").addEventListener("change", e => {
    selectedMonth = e.target.value;
    renderTable();
});

document.getElementById("nameFilter").addEventListener("input", e => {
    searchName = e.target.value.trim();
    renderTable();
});

populateOccasionFilter();
getEvent();

</script>

</body>
</html>
