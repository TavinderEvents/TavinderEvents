<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        /* Allow viewport height and natural horizontal scrolling */
        html {
            height: 100%;
            overflow-x: auto;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            min-width: 1200px; /* Expands canvas for viewport-level horizontal scrollbar */
            display: flex;
            flex-direction: column;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        .container {
            padding: 10px;
            width: 100%;
            flex: 1 0 auto; /* Expands to push footer to the absolute bottom */
        }

        .table-responsive {
            width: 100%;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: maroon;
            color: white;
        }

        th, td {
            padding: 8px;
            border: 1px solid #ddd;
            white-space: nowrap;
            text-align: left;
        }

        th {
            background-color: #6c0202;
        }

        th:last-child, td:last-child {
            text-align: center;
            width: 110px;
        }

        .filter-container {
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-container input,
        .filter-container select {
            padding: 6px;
            min-width: 150px;
        }

        button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            background-color: #6c0202;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: darkred;
        }

        .btn-send-mail {
            background-color: #2980b9;
            color: white;
            font-weight: bold;
        }

        .btn-send-mail:hover {
            background-color: #1f618d;
        }

        /* Footer pinned to bottom of page viewport */
        footer {
            text-align: center;
            padding: 15px;
            background-color: #333;
            color: white;
            margin-top: auto;
            position: sticky;
            bottom: 0;
            width: 100%;
            z-index: 100;
        }

        footer button {
            background-color: maroon;
        }

        /* Mobile View (Card Layout) */
        @media screen and (max-width: 768px) {
            html {
                overflow-x: hidden;
            }

            body {
                padding: 5px;
                min-width: 100%;
            }

            .container {
                padding: 5px;
            }

            h1 {
                font-size: 22px;
            }

            .filter-container {
                flex-direction: column;
                gap: 8px;
            }

            .filter-container div {
                width: 100%;
            }

            .filter-container input,
            .filter-container select {
                width: 100%;
            }

            table {
                min-width: 100%;
                border: none;
                background-color: transparent;
            }

            #eventTable,
            #eventTable thead,
            #eventTable tbody,
            #eventTable th,
            #eventTable td,
            #eventTable tr {
                display: block;
            }

            #eventTable thead {
                display: none;
            }

            #eventTable tr {
                margin-bottom: 15px;
                border: 2px solid maroon;
                border-radius: 8px;
                background: white;
                color: black;
                padding: 8px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            }

            #eventTable td {
                border: none;
                border-bottom: 1px solid #ddd;
                position: relative;
                padding: 8px 8px 8px 38%;
                text-align: left;
                min-height: 38px;
                word-break: break-word;
                white-space: normal;
                width: 100% !important;
                box-sizing: border-box;
            }

            #eventTable td:last-child {
                border-bottom: none;
                padding-left: 8px;
            }

            #eventTable td:before {
                position: absolute;
                left: 8px;
                top: 8px;
                width: 30%;
                font-weight: bold;
                white-space: nowrap;
                color: maroon;
                font-size: 12px;
            }

            #eventTable td:last-child:before {
                content: "" !important;
            }

            /* Mobile Column Labels */
            #eventTable td:nth-child(1):before { content: "S.No"; }
            #eventTable td:nth-child(2):before { content: "Occasion"; }
            #eventTable td:nth-child(3):before { content: "From Name"; }
            #eventTable td:nth-child(4):before { content: "From Email"; }
            #eventTable td:nth-child(5):before { content: "From Mobile"; }
            #eventTable td:nth-child(6):before { content: "To Name"; }
            #eventTable td:nth-child(7):before { content: "Greet Name"; }
            #eventTable td:nth-child(8):before { content: "To Email"; }
            #eventTable td:nth-child(9):before { content: "To Mobile"; }
            #eventTable td:nth-child(10):before { content: "Relation"; }
            #eventTable td:nth-child(11):before { content: "Recurring"; }
            #eventTable td:nth-child(12):before { content: "Reminder"; }
            #eventTable td:nth-child(13):before { content: "Date"; }

            #eventTable td button {
                width: 100%;
                margin: 4px 0;
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Event Management</h1>

    <!-- Filters -->
    <div class="filter-container">
        <div>
            <label>Name:</label><br>
            <input type="text" id="nameFilter" placeholder="Search name...">
        </div>

        <div>
            <label>Occasion:</label><br>
            <select id="occasionFilter">
                <option value="">All</option>
            </select>
        </div>

        <div>
            <label>Month:</label><br>
            <select id="monthFilter">
                <option value="">All</option>
                <option value="01">Jan</option>
                <option value="02">Feb</option>
                <option value="03">Mar</option>
                <option value="04">Apr</option>
                <option value="05">May</option>
                <option value="06">Jun</option>
                <option value="07">Jul</option>
                <option value="08">Aug</option>
                <option value="09">Sep</option>
                <option value="10">Oct</option>
                <option value="11">Nov</option>
                <option value="12">Dec</option>
            </select>
        </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
        <table id="eventTable">
            <thead>
            <tr>
                <th>S.No</th>
                <th>Occasion</th>
                <th>From Name</th>
                <th>From Email</th>
                <th>From Mobile</th>
                <th>To Name</th>
                <th>Greet Name</th>
                <th>To Email</th>
                <th>To Mobile</th>
                <th>Relation</th>
                <th>Recurring</th>
                <th>Reminder</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="eventList"></tbody>
        </table>
    </div>
</div>

<footer>
    <a href="index.html"><button>Back to Main Menu</button></a>
</footer>

<!-- EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDAHhKZEFIm4Z1HyTRGCaqJ1NGC7KelQ38",
  authDomain: "tavinderevents.firebaseapp.com",
  projectId: "tavinderevents",
  storageBucket: "tavinderevents.firebasestorage.app",
  messagingSenderId: "62017081718",
  appId: "1:62017081718:web:503ed1151d3235f719aa57",
  measurementId: "G-7RYTW534N1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Initialize EmailJS
emailjs.init("UUiVKSDERxZLzZndq");

let BirthdayMessages = [];
let BirthdayImageLinks = [];
let AnniversaryMessages = [];
let AnniversaryImageLinks = [];
let ReminderImage = "";

async function loadContentConfig() {
    try {
        const content = await fetch('./shared/eventContent.json').then(response => response.json());
        BirthdayMessages = content.Birthday.messages;
        BirthdayImageLinks = content.Birthday.images;
        AnniversaryMessages = content.Anniversary.messages;
        AnniversaryImageLinks = content.Anniversary.images;
        ReminderImage = content.Reminder.image;
    } catch (err) {
        console.error("Failed to load eventContent.json", err);
    }
}

let selectedOccasion = "";
let selectedMonth = "";
let searchName = "";
let allEventsCache = [];

async function getEvent() {
    const eventList = document.getElementById("eventList");
    eventList.innerHTML = "";

    try {
        const snapshot = await getDocs(collection(db, "Event"));

        if (snapshot.empty) {
            eventList.innerHTML = "<tr><td colspan='14'>No data available.</td></tr>";
            return;
        }

        allEventsCache = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
        }));

        renderTable();
    } catch (error) {
        console.error("ERROR loading data:", error);
        eventList.innerHTML = "<tr><td colspan='14'>Error loading data.</td></tr>";
    }
}

function renderTable() {
    const eventList = document.getElementById("eventList");
    eventList.innerHTML = "";

    const filteredEvents = allEventsCache.filter(event => {
        let month = "";
        if (event.Date) {
            const d = new Date(event.Date);
            if (!isNaN(d)) {
                month = String(d.getMonth() + 1).padStart(2, "0");
            }
        }

        const fromName = (event.From_Name || "").toLowerCase();
        const toName = (event.To_Name || "").toLowerCase();
        const email = (event.To_Email || "").toLowerCase();
        const occasion = (event.Occasion || "").toLowerCase();

        const matchName = searchName
            ? fromName.includes(searchName.toLowerCase()) ||
              toName.includes(searchName.toLowerCase()) ||
              email.includes(searchName.toLowerCase()) ||
              occasion.includes(searchName.toLowerCase())
            : true;

        const matchOccasion = selectedOccasion ? event.Occasion === selectedOccasion : true;
        const matchMonth = selectedMonth ? month === selectedMonth : true;

        return matchName && matchOccasion && matchMonth;
    });

    filteredEvents.sort((a, b) => (Number(a.SNo) || 0) - (Number(b.SNo) || 0));

    if (filteredEvents.length === 0) {
        eventList.innerHTML = "<tr><td colspan='14'>No matching events found.</td></tr>";
        return;
    }

    filteredEvents.forEach(event => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${event.SNo ?? ""}</td>
            <td>${event.Occasion ?? ""}</td>
            <td>${event.From_Name ?? ""}</td>
            <td>${event.From_Email ?? ""}</td>
            <td>${event.From_Mobile ?? ""}</td>
            <td>${event.To_Name ?? ""}</td>
            <td>${event.To_Gname ?? ""}</td>
            <td>${event.To_Email ?? ""}</td>
            <td>${event.To_Mobile ?? ""}</td>
            <td>${event.Relation ?? ""}</td>
            <td>${event.Recurring ?? ""}</td>
            <td>${event.Reminder_Message ?? ""}</td>
            <td>${event.Date ?? ""}</td>
            <td>
                <button class="btn-send-mail" onclick="sendMailForRecord('${event.id}')">Send Mail</button>
            </td>
        `;

        eventList.appendChild(row);
    });
}

function sendEmail(toEmail, subject, message, name, link) {
    return emailjs.send("service_jitwsrj", "template_8wpg95p", {
        to_name: name,
        subject: subject,
        message: message,
        email: toEmail,
        link: link
    });
}

window.sendMailForRecord = async function(docId) {
    const data = allEventsCache.find(e => e.id === docId);
    if (!data) return;

    if (!data.To_Email) {
        alert("Recipient email is missing for this record.");
        return;
    }

    let formattedDate = "";
    if (data.Date) {
        formattedDate = new Date(data.Date).toLocaleDateString('en-GB', {
            day: '2-digit',
            month: 'short',
            year: 'numeric'
        }).replace(/ /g, '-');
    }

    let subject = "";
    let message = "";
    let link = "";

    if (data.Occasion === "Birthday") {
        const RandomBirthdayMessage = BirthdayMessages.length > 0 
            ? BirthdayMessages[Math.floor(Math.random() * BirthdayMessages.length)] 
            : "Happy Birthday!";
        const BirthdayRandomLink = BirthdayImageLinks.length > 0 
            ? BirthdayImageLinks[Math.floor(Math.random() * BirthdayImageLinks.length)] 
            : "";

        subject = `Happy Birthday - ${data.To_Name || ''} - ${formattedDate}`;
        message = RandomBirthdayMessage;
        link = BirthdayRandomLink;
    } 
    else if (data.Occasion === "Anniversary") {
        const RandomAnniversaryMessage = AnniversaryMessages.length > 0 
            ? AnniversaryMessages[Math.floor(Math.random() * AnniversaryMessages.length)] 
            : "Happy Anniversary!";
        const AnniversaryRandomLink = AnniversaryImageLinks.length > 0 
            ? AnniversaryImageLinks[Math.floor(Math.random() * AnniversaryImageLinks.length)] 
            : "";

        subject = `Happy Anniversary ${data.To_Name || ''} - ${formattedDate}`;
        message = RandomAnniversaryMessage;
        link = AnniversaryRandomLink;
    } 
    else if (data.Occasion === "ReminderSelf") {
        subject = `Reminder ${data.To_Name || ''} - ${formattedDate}`;
        message = `Reminder Message: ${data.Reminder_Message || ''}`;
        link = ReminderImage;
    } 
    else if (data.Occasion === "Reminder") {
        subject = `Reminder ${data.To_Name || ''} - ${formattedDate}`;
        message = `Reminder Message: ${data.Reminder_Message || ''}`;
        link = ReminderImage;
    } 
    else if (data.Occasion === "Reminder-Birthday") {
        subject = `Reminder-Birthday ${data.To_Name || ''} - ${formattedDate}`;
        message = `Birthday Wishes for ${data.To_Name || ''} - ${formattedDate}`;
        link = ReminderImage;
    } 
    else if (data.Occasion === "Reminder-Anniversary") {
        subject = `Reminder-Anniversary ${data.To_Name || ''} - ${formattedDate}`;
        message = `Anniversary Wishes for ${data.To_Name || ''} - ${formattedDate}`;
        link = ReminderImage;
    }
    else {
        subject = `Event Notification - ${formattedDate}`;
        message = data.Reminder_Message || "Event Notification";
        link = ReminderImage;
    }

    try {
        await sendEmail(data.To_Email, subject, message, data.To_Gname || data.To_Name || '', link);
        alert(`Email sent successfully to ${data.To_Email}!`);
    } catch (err) {
        console.error("Failed to send email:", err);
        alert("Failed to send email. Please check console for details.");
    }
};

async function populateOccasionFilter() {
    const select = document.getElementById("occasionFilter");
    try {
        const snapshot = await getDocs(collection(db, "Event"));
        const set = new Set();

        snapshot.docs.forEach(doc => {
            const occ = doc.data().Occasion;
            if (occ) set.add(occ);
        });

        set.forEach(o => {
            const opt = document.createElement("option");
            opt.value = o;
            opt.textContent = o;
            select.appendChild(opt);
        });
    } catch (error) {
        console.error("Dropdown error:", error);
    }
}

document.getElementById("occasionFilter").addEventListener("change", e => {
    selectedOccasion = e.target.value;
    renderTable();
});

document.getElementById("monthFilter").addEventListener("change", e => {
    selectedMonth = e.target.value;
    renderTable();
});

document.getElementById("nameFilter").addEventListener("input", e => {
    searchName = e.target.value.trim();
    renderTable();
});

await loadContentConfig();
populateOccasionFilter();
getEvent();

</script>

</body>
</html>
